name: release

# The version bump is the trigger. A pull request that changes `version` in
# pyproject.toml is a release PR — it goes through review and CI like any other, and
# merging it publishes. Tagging is an output of this workflow, not an input: a workflow
# that pushes a tag with GITHUB_TOKEN cannot trigger another workflow, so a separate
# tag-then-release pair would silently never publish.
on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
    # Kept alongside the bump trigger so a hand-pushed tag still releases. Dropping it
    # created a window where neither mechanism fired and a version shipped nowhere.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would happen, without tagging or publishing"
        type: boolean
        default: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7

      # No setup-uv here: this job only reads a string out of a TOML file. Installing a
      # toolchain for that also installs its post-job cache step, which fails when the
      # job never populated a cache — which is exactly what broke the 0.4.0 release.
      - name: Decide whether this version needs releasing
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ -z "$version" ]; then
            echo "Could not read the version from pyproject.toml." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Ask the index, not git. A tag only proves someone tagged; PyPI is the
          # irreversible step and the only thing that must never happen twice. Using the
          # tag as the signal shipped a tagged-but-unpublished version once already.
          # The simple index is used deliberately: the JSON API is CDN-cached and lagged
          # by minutes during the 0.2.0 release.
          if curl -sf "https://pypi.org/simple/rag-ci/" \
               | grep -q "rag_ci-$version\.tar\.gz"; then
            echo "$version is already on PyPI; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: would release v$version." >> "$GITHUB_STEP_SUMMARY"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version." >> "$GITHUB_STEP_SUMMARY"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      # A PyPI version number can never be reused, so the suite runs once more here
      # even though CI already passed on the commit.
      - run: uv sync --locked --dev
      - run: uv run pytest -q

      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI trusted publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Tag and GitHub release come last: PyPI is the irreversible step, and a tag that
  # exists without a published package would make the next run skip it.
  tag-and-release:
    needs: [detect, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Tag the commit and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --generate-notes
          fi
