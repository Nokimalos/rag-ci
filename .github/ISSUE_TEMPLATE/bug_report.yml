name: Bug report
description: Something behaves differently from what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The most useful thing you can give us is a way to reproduce it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The smallest adapter and golden set that show the problem. Forking
        `examples/reference/` is usually the quickest way. Include the exact command you ran.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: rag-ci version
      description: Output of `uvx rag-ci --version`
      placeholder: "0.6.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.7"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full console output or run record, if you have it.
      render: shell
